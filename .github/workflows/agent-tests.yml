name: agent-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight agent test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.141.1 uvicorn==0.52.4 httpx2==2.12.0
          python -m pip install -e .
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Run routing evaluation
        run: python scripts/evaluate_agent_routes.py
      - name: Run V5 harness evaluation
        run: python scripts/evaluate_v5_harness.py
