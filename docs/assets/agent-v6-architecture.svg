<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Carbon Credit Agent V6 architecture</title>
  <desc id="desc">A LangGraph workflow connects planner, tool executor, evidence tools, verifier, and durable state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20c997"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#62d5c7"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#1f6f78" opacity=".13"/>
  <circle cx="90" cy="590" r="230" fill="#0ea5e9" opacity=".08"/>
  <text x="58" y="70" fill="#f4fbff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Carbon Credit Agent V6</text>
  <text x="58" y="105" fill="#8fb3c2" font-family="Segoe UI,Arial,sans-serif" font-size="18">LangGraph orchestration · LangChain tools · evidence-grounded review</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="55" y="175" width="180" height="86" rx="16" fill="#102d3d" stroke="#2b6671"/>
    <text x="145" y="210" text-anchor="middle" fill="#a8c9d4" font-size="14">ENTRY</text>
    <text x="145" y="238" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">API / CLI / UI</text>

    <rect x="300" y="175" width="190" height="86" rx="16" fill="#123b41" stroke="#20c997" stroke-width="2"/>
    <text x="395" y="210" text-anchor="middle" fill="#78e6cf" font-size="14">LANGGRAPH NODE</text>
    <text x="395" y="238" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Planner</text>

    <rect x="555" y="175" width="205" height="86" rx="16" fill="#123b41" stroke="#20c997" stroke-width="2"/>
    <text x="657" y="210" text-anchor="middle" fill="#78e6cf" font-size="14">LANGGRAPH NODE</text>
    <text x="657" y="238" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Tool Executor</text>

    <rect x="825" y="175" width="215" height="86" rx="16" fill="#123b41" stroke="#38bdf8" stroke-width="2"/>
    <text x="932" y="210" text-anchor="middle" fill="#8edaff" font-size="14">POLICY NODE</text>
    <text x="932" y="238" text-anchor="middle" fill="#fff" font-size="20" font-weight="600">Output Verifier</text>

    <rect x="1080" y="175" width="70" height="86" rx="16" fill="#17394a" stroke="#5bb8dd"/>
    <text x="1115" y="225" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">END</text>
  </g>

  <g stroke="#62d5c7" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M235 218 H294"/>
    <path d="M490 218 H549"/>
    <path d="M760 218 H819"/>
    <path d="M1040 218 H1074"/>
    <path d="M657 268 C657 330 395 330 395 268"/>
  </g>
  <text x="520" y="313" fill="#71cfc5" font-family="Segoe UI,Arial,sans-serif" font-size="13">observation → next decision</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="315" y="382" width="190" height="96" rx="15" fill="#142738" stroke="#41596a"/>
    <text x="410" y="415" text-anchor="middle" fill="#8fb3c2" font-size="13">KNOWLEDGE TOOL</text>
    <text x="410" y="443" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Hybrid RAG</text>
    <text x="410" y="465" text-anchor="middle" fill="#7fa4b3" font-size="12">E5 · BM25 · RRF · Reranker</text>

    <rect x="530" y="382" width="190" height="96" rx="15" fill="#142738" stroke="#41596a"/>
    <text x="625" y="415" text-anchor="middle" fill="#8fb3c2" font-size="13">BUSINESS TOOL</text>
    <text x="625" y="443" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Registry Lookup</text>
    <text x="625" y="465" text-anchor="middle" fill="#7fa4b3" font-size="12">11,110 records · provenance</text>

    <rect x="745" y="382" width="190" height="96" rx="15" fill="#142738" stroke="#d29b45"/>
    <text x="840" y="415" text-anchor="middle" fill="#e8be79" font-size="13">APPROVAL TOOL</text>
    <text x="840" y="443" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Risk Review</text>
    <text x="840" y="465" text-anchor="middle" fill="#bda47b" font-size="12">human authorization required</text>
  </g>
  <g stroke="#4c8794" stroke-width="2" fill="none">
    <path d="M657 261 V345 H410 V376"/>
    <path d="M657 261 V376"/>
    <path d="M657 345 H840 V376"/>
  </g>

  <rect x="55" y="532" width="1095" height="52" rx="14" fill="#0d202e" stroke="#274557"/>
  <text x="80" y="565" fill="#6de1cc" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">DURABLE STATE</text>
  <text x="225" y="565" fill="#c0d6df" font-family="Segoe UI,Arial,sans-serif" font-size="14">LangGraph Checkpointer</text>
  <circle cx="400" cy="560" r="3" fill="#557888"/>
  <text x="420" y="565" fill="#c0d6df" font-family="Segoe UI,Arial,sans-serif" font-size="14">SQLite Memory</text>
  <circle cx="555" cy="560" r="3" fill="#557888"/>
  <text x="575" y="565" fill="#c0d6df" font-family="Segoe UI,Arial,sans-serif" font-size="14">Idempotency</text>
  <circle cx="695" cy="560" r="3" fill="#557888"/>
  <text x="715" y="565" fill="#c0d6df" font-family="Segoe UI,Arial,sans-serif" font-size="14">Event Replay</text>
  <circle cx="850" cy="560" r="3" fill="#557888"/>
  <text x="870" y="565" fill="#c0d6df" font-family="Segoe UI,Arial,sans-serif" font-size="14">Citation Audit</text>
</svg>
