[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-credit-agent"
version = "6.0.0"
description = "A traceable multi-agent assistant for carbon-credit evidence review"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.3.18",
    "langgraph==1.2.11",
    "langchain-deepseek==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["carbon_agent*"]
