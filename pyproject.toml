[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-credit-agent"
version = "5.0.0"
description = "A traceable multi-agent assistant for carbon-credit evidence review"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["carbon_agent*"]
