[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-credit-agent"
version = "6.1.0"
description = "An evidence-grounded agent for carbon-credit review with custom and LangGraph runtimes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["agent", "rag", "langgraph", "langchain", "carbon-credit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "openai==3.3.1",
    "python-dotenv==1.2.3",
    "langchain==1.3.18",
    "langgraph==1.2.11",
    "langchain-deepseek==1.1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["carbon_agent*"]
